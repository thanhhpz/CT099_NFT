<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý giao dịch</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="users.html">Người dùng</a>
            <a href="games.html">Trò chơi</a>
            <a href="characters.html">Nhân vật</a>
            <a href="items.html">Vật phẩm</a>
            <a href="nfts.html">NFT</a>
            <a href="rentals.html">Hợp đồng</a>
            <a href="transactions.html" class="active">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <h2 style="font-size:18px;font-weight:600;margin-bottom:14px;">Quản lý giao dịch</h2>

            <div id="transactionList"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user || user.vai_tro !== 'quan_tri') {
            window.location.href = '../login.html';
        }

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadTransactions() {
            try {
                const res = await fetch('http://localhost:5000/api/admin/transactions', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    let html = `
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>STT</th>
                                        <th>Mã giao dịch</th>
                                        <th>Người thực hiện</th>
                                        <th>Loại</th>
                                        <th>Số tiền</th>
                                        <th>Hợp đồng</th>
                                        <th>Thời gian</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    const typeMap = {
                        'thanh_toan_thue': 'Thanh toán thuê',
                        'hoan_tien_coc': 'Hoàn tiền cọc',
                        'phat': 'Phạt',
                        'nap_tien': 'Nạp tiền'
                    };

                    if (data.transactions.length === 0) {
                        html += `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">Chưa có giao dịch nào</td></tr>`;
                    } else {
                        data.transactions.forEach((tx, index) => {
                            // Lấy tên người thực hiện
                            let nguoiThucHien = tx.ten_nguoi_thuc_hien || 'Hệ thống';
                            let hoTen = tx.ho_ten_nguoi_thuc_hien || '';
                            
                            // Hiển thị tên đăng nhập + họ tên (nếu có)
                            let displayName = nguoiThucHien;
                            if (hoTen && hoTen !== 'Không rõ' && hoTen !== 'Hệ thống') {
                                displayName = `${nguoiThucHien} (${hoTen})`;
                            }
                            
                            // Nếu là nạp tiền, highlight màu xanh
                            const isNapTien = tx.loai_giao_dich === 'nap_tien';
                            const rowStyle = isNapTien ? 'background: rgba(16, 185, 129, 0.05);' : '';
                            
                            html += `
                                <tr style="${rowStyle}">
                                    <td>${index + 1}</td>
                                    <td style="font-family:monospace;font-size:12px;">${tx.ma_giao_dich}</td>
                                    <td>
                                        <strong>${displayName}</strong>
                                        ${isNapTien ? '<span style="color:#10b981;font-size:11px;margin-left:5px;">⬆ Nạp</span>' : ''}
                                    </td>
                                    <td>${typeMap[tx.loai_giao_dich] || tx.loai_giao_dich}</td>
                                    <td>
                                        <strong style="${tx.loai_giao_dich === 'nap_tien' ? 'color:#10b981;' : ''}">
                                            ${tx.so_tien_giao_dich}
                                        </strong> COINS
                                    </td>
                                    <td style="font-family:monospace;font-size:12px;">${tx.ma_hop_dong || '-'}</td>
                                    <td>${new Date(tx.thoi_gian_thanh_toan).toLocaleString('vi-VN')}</td>
                                </tr>
                            `;
                        });
                    }

                    html += '</tbody></table></div>';
                    document.getElementById('transactionList').innerHTML = html;
                }
            } catch (error) {
                document.getElementById('transactionList').innerHTML = `<div class="msg msg-error">Lỗi tải danh sách giao dịch</div>`;
            }
        }

        loadTransactions();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        });
    </script>
</body>
</html>

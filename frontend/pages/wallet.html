<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ví của tôi</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-brand">NFT <span>RENTAL</span></div>
      <div class="topbar-nav" id="topbarNav">
        <a href="dashboard.html">Tổng quan</a>
        <a href="games.html">Trò chơi</a>
        <a href="marketplace.html">Chợ NFT</a>
        <a href="my-nfts.html">NFT của tôi</a>
        <a href="rentals.html">Thuê</a>
        <a href="wallet.html" class="active">Ví</a>
        <a href="transactions.html">Giao dịch</a>
        <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
      </div>
      <div class="topbar-right">
        <div class="balance-box">
          <span class="amount" id="walletBalance">0</span> COINS
        </div>
        <button class="topbar-toggle" onclick="toggleNav()">☰</button>
      </div>
    </header>

    <div class="container">
      <main style="max-width: 500px; margin: 0 auto">
        <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 14px">
          Ví
        </h2>
        <div id="walletInfo"></div>
        <div id="depositForm"></div>
      </main>
    </div>
    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user"));

      if (!token || !user) {
        window.location.href = "login.html";
      }

      function toggleNav() {
        document.getElementById("topbarNav").classList.toggle("open");
      }

      async function loadWallet() {
        try {
          // Ưu tiên gọi API theo tên người dùng, nếu thất bại sẽ dùng endpoint fallback theo User ID (ma_nguoi_dung)
          let username = user.ten_nguoi_dung || user.username;
          let res = await fetch(
            `http://localhost:5000/api/wallet/${username}`,
            {
              headers: { Authorization: `Bearer ${token}` },
            },
          );
          let data = await res.json();

          // Trường hợp người dùng chưa có ví, gọi API tạo/lấy ví theo ma_nguoi_dung
          if (
            !data.success &&
            (user.ma_nguoi_dung || user.id_nguoi_dung || user.id)
          ) {
            const userId = user.ma_nguoi_dung || user.id_nguoi_dung || user.id;
            res = await fetch(
              `http://localhost:5000/api/wallet/user/${userId}`,
              {
                headers: { Authorization: `Bearer ${token}` },
              },
            );
            data = await res.json();
          }

          if (data.success && data.wallet) {
            const balance =
              data.wallet.so_du !== undefined
                ? data.wallet.so_du
                : data.wallet.balance || 0;
            const address =
              data.wallet.dia_chi || data.wallet.address || "Đang cập nhật...";
            const ownerName = data.wallet.ten_nguoi_dung || username;

            document.getElementById("walletBalance").textContent = balance;

            document.getElementById("walletInfo").innerHTML = `
                        <div class="card">
                            <div class="card-header">Thông tin ví</div>
                            <p style="font-size:28px;font-weight:700;color:var(--gold);">${balance} <span style="font-size:14px;font-weight:400;color:var(--text-muted);">COINS</span></p>
                            <p style="font-size:12px;color:var(--text-muted);font-family:monospace;word-break:break-all;">${address}</p>
                            <p style="font-size:13px;color:var(--text-secondary);">Chủ sở hữu: ${ownerName}</p>
                        </div>
                    `;

            document.getElementById("depositForm").innerHTML = `
                        <div class="card">
                            <div class="card-header">Nạp tiền</div>
                            <form id="depositFormSubmit">
                                <div class="form-group">
                                    <label>Số COINS</label>
                                    <input type="number" id="depositAmount" value="100" min="1" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-full">Nạp</button>
                            </form>
                        </div>
                    `;

            // Lắng nghe sự kiện Submit nạp tiền
            document
              .getElementById("depositFormSubmit")
              .addEventListener("submit", handleDeposit);
          } else {
            document.getElementById("walletInfo").innerHTML =
              `<div class="msg msg-error">${data.message || "Không thể tải dữ liệu ví"}</div>`;
          }
        } catch (error) {
          console.error("Lỗi khi tải thông tin ví:", error);
          document.getElementById("walletInfo").innerHTML =
            `<div class="msg msg-error">Lỗi kết nối máy chủ</div>`;
        }
      }

      async function handleDeposit(e) {
        e.preventDefault();
        const amount =
          parseInt(document.getElementById("depositAmount").value) || 0;
        if (amount <= 0) {
          alert("Số COINS không hợp lệ");
          return;
        }

        if (!confirm(`Xác nhận nạp ${amount} COINS vào ví?`)) return;

        try {
          const res = await fetch("http://localhost:5000/api/wallet/deposit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              ten_nguoi_dung: user.ten_nguoi_dung || user.username,
              so_tien: amount,
            }),
          });

          const data = await res.json();
          if (data.success) {
            alert(data.message || "Nạp tiền thành công!");
            loadWallet(); // Tải lại thông tin ví để cập nhật số dư mới
          } else {
            alert("Lỗi: " + data.message);
          }
        } catch (error) {
          console.error("Lỗi giao dịch nạp tiền:", error);
          alert("Lỗi kết nối máy chủ khi thực hiện nạp tiền");
        }
      }

      // Đăng xuất
      document
        .getElementById("logoutBtn")
        .addEventListener("click", function (e) {
          e.preventDefault();
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          window.location.href = "login.html";
        });

      // Khởi chạy khi trang web hoàn tất tải DOM
      document.addEventListener("DOMContentLoaded", loadWallet);
    </script>
  </body>
</html>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thanh toán thuê NFT</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/payment.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-brand">
        NFT <span>RENTAL</span>
      </div>

      <div class="topbar-nav" id="topbarNav">
        <a href="dashboard.html">Tổng quan</a>
        <a href="games.html">Trò chơi</a>
        <a href="marketplace.html">Chợ NFT</a>
        <a href="my-nfts.html">NFT của tôi</a>
        <a href="rentals.html">Thuê</a>
        <a href="wallet.html">Ví</a>
        <a href="transactions.html">Giao dịch</a>
        <a href="notifications.html">Thông báo</a>
        <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
      </div>

      <div class="topbar-right">
        <div class="balance-box">
          <span class="amount" id="walletBalance">0</span> COINS
        </div>

        <button class="topbar-toggle" onclick="toggleNav()">
          ☰
        </button>
      </div>
    </header>

    <div class="container">
      <main class="payment-page">
        <h2 class="payment-page-title">
          Thanh toán thuê NFT
        </h2>

        <section class="payment-card">
          <div class="payment-card-header">
            <span>THANH TOÁN THUÊ NFT</span>
          </div>

          <div class="payment-row">
            <span class="payment-label">NFT</span>
            <strong id="paymentNftName">—</strong>
          </div>

          <div class="payment-row">
            <span class="payment-label">Giá thuê</span>
            <strong>
              <span id="paymentRentPrice">0</span> COINS
            </strong>
          </div>

          <div class="payment-row">
            <span class="payment-label">Thời gian thuê</span>
            <strong id="paymentDuration">—</strong>
          </div>

          <div class="payment-row">
            <span class="payment-label">Phí giao dịch</span>
            <strong>
              <span id="paymentServiceFee">0</span> COINS
            </strong>
          </div>

          <div class="payment-divider"></div>

          <div class="payment-row payment-total-row">
            <span class="payment-label">Tổng thanh toán</span>
            <strong>
              <span id="paymentTotal">0</span> COINS
            </strong>
          </div>

          <div class="payment-row">
            <span class="payment-label">Số dư ví</span>
            <strong>
              <span id="paymentBalance">0</span> COINS
            </strong>
          </div>

          <div class="payment-row">
            <span class="payment-label">Số dư sau thanh toán</span>
            <strong>
              <span id="paymentBalanceAfter">0</span> COINS
            </strong>
          </div>

          <div class="payment-actions">
            <button
              type="button"
              class="btn btn-secondary"
              id="cancelPaymentBtn"
            >
              Hủy
            </button>

            <button
              type="button"
              class="btn btn-primary"
              id="confirmPaymentBtn"
            >
              Xác nhận thanh toán
            </button>
          </div>
        </section>
      </main>
    </div>

    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user"));
      const paymentText =
        sessionStorage.getItem("rentalPayment");

      if (!token || !user) {
        window.location.href = "login.html";
      }

      if (!paymentText) {
        alert("Không tìm thấy thông tin thanh toán");
        window.location.href = "marketplace.html";
      }

      const payment = JSON.parse(paymentText);

      function toggleNav() {
        document
          .getElementById("topbarNav")
          .classList.toggle("open");
      }

      function formatCoin(value) {
        const number = Number(value) || 0;

        return Number.isInteger(number)
          ? number.toString()
          : number.toFixed(2).replace(/\.?0+$/, "");
      }

      function renderPayment() {
        document.getElementById(
          "paymentNftName",
        ).textContent = payment.ten_nft || "Không rõ";

        document.getElementById(
          "paymentRentPrice",
        ).textContent = formatCoin(payment.tien_thue);

        document.getElementById(
          "paymentDuration",
        ).textContent =
          payment.thoi_luong_hien_thi || "Không rõ";

        document.getElementById(
          "paymentServiceFee",
        ).textContent = formatCoin(payment.phi_dich_vu);

        document.getElementById(
          "paymentTotal",
        ).textContent = formatCoin(
          payment.tong_thanh_toan,
        );

        document.getElementById(
          "paymentBalance",
        ).textContent = formatCoin(
          payment.so_du_hien_tai,
        );

        document.getElementById(
          "paymentBalanceAfter",
        ).textContent = formatCoin(
          payment.so_du_sau_thanh_toan,
        );

        document.getElementById(
          "walletBalance",
        ).textContent = formatCoin(
          payment.so_du_hien_tai,
        );
      }

      document
        .getElementById("cancelPaymentBtn")
        .addEventListener("click", function () {
          sessionStorage.removeItem("rentalPayment");
          window.history.back();
        });

      document
        .getElementById("confirmPaymentBtn")
        .addEventListener("click", function () {
          window.location.href = "sign-rental.html";
        });

      document
        .getElementById("logoutBtn")
        .addEventListener("click", function (e) {
          e.preventDefault();

          localStorage.removeItem("token");
          localStorage.removeItem("user");
          sessionStorage.removeItem("rentalPayment");

          window.location.href = "login.html";
        });

      renderPayment();
    </script>
  </body>
</html>
